<!-- Sent when someone registers. {{ .Token }} is the code they type on the site. -->
<div style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 460px; margin: 0 auto; padding: 24px; color: #111111;">
  <p style="font-size: 18px; margin: 0 0 20px;"><strong>DelftRate</strong></p>
  <p style="margin: 0 0 12px;">Your code to confirm your DelftRate account:</p>
  <p style="font-family: Menlo, Consolas, monospace; font-size: 32px; letter-spacing: 6px; font-weight: bold; margin: 0 0 20px;">{{ .Token }}</p>
  <p style="margin: 0 0 12px;">Type it on the page where you registered. The code works for one hour.</p>
  <p style="margin: 0; color: #666666; font-size: 13px;">If you did not register on DelftRate, you can ignore this email. No account is created without the code.</p>
</div>
